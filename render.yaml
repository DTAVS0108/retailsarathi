# Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: retailsarathi-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://retailsarathi.in,https://www.retailsarathi.in
      - key: PUBLIC_API_ORIGIN
        value: https://api.retailsarathi.in
      - key: REDIS_URL
        fromService:
          type: redis
          name: retailsarathi-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: retailsarathi-db
          property: connectionString

  - type: redis
    name: retailsarathi-redis
    plan: starter
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: retailsarathi-db
    plan: basic-256mb
    region: singapore
    databaseName: retailsarathi
    user: retailsarathi
